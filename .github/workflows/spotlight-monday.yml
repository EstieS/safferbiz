name: 🤝 Meet the Maker (weekly spotlight)

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'How many spotlight drafts to produce'
        required: false
        default: '3'
      dry_run:
        description: 'Dry run (preview only, no email)'
        type: boolean
        default: false

jobs:
  spotlight:
    name: Generate weekly business spotlight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run spotlight agent
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
        run: |
          node scripts/spotlight-business.mjs \
            --count=${{ github.event.inputs.count || '3' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
